<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B4FBF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Buddy 2048</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="title-row">
        <h1>Buddy 2048</h1>
        <div class="icon-buttons">
          <button type="button" class="tiny-btn" id="how-btn" aria-label="How to play">?</button>
          <button type="button" class="tiny-btn" id="sound-btn" aria-pressed="true">Sound</button>
        </div>
      </div>
      <p class="tag">Slide the same animals together.</p>
      <p class="goal-label">Win at</p>
      <div class="goals" id="goals" role="radiogroup" aria-label="Number you need to win">
        <button type="button" class="goal-btn" data-goal="256" role="radio">256</button>
        <button type="button" class="goal-btn" data-goal="512" role="radio">512</button>
        <button type="button" class="goal-btn" data-goal="1024" role="radio">1024</button>
        <button type="button" class="goal-btn" data-goal="2048" role="radio">2048</button>
      </div>
      <div class="stats">
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
        <div class="stat"><span>Best</span><strong id="best">0</strong></div>
      </div>
      <p class="goal-line" id="goal-line"></p>
    </header>

    <div class="board-wrap">
      <div class="board" id="board">
        <div class="cells" id="cells"></div>
        <div class="tiles" id="tiles"></div>
      </div>
      <div class="toast" id="toast" hidden></div>
    </div>

    <div class="actions">
      <button type="button" class="text-btn" id="undo-btn">Oops</button>
      <button type="button" class="text-btn" id="new-btn">New</button>
    </div>
    <div class="pad">
      <button type="button" class="arrow" data-dir="up" aria-label="Up">▲</button>
      <button type="button" class="arrow" data-dir="left" aria-label="Left">◀</button>
      <button type="button" class="arrow" data-dir="down" aria-label="Down">▼</button>
      <button type="button" class="arrow" data-dir="right" aria-label="Right">▶</button>
    </div>
  </main>

  <p class="live" id="live" aria-live="polite"></p>

  <dialog id="how-dialog">
    <h2>How to play</h2>
    <div class="steps">
      <div class="step"><div class="ico" id="step-slide">➜</div><p>Slide</p></div>
      <div class="step"><div class="ico" id="step-same"></div><p>Same ones join</p></div>
      <div class="step"><div class="ico" id="step-next"></div><p>Make a bigger one</p></div>
    </div>
    <p>2 and 2 make 4. Keep going until you make the animal you picked.</p>
    <button type="button" class="text-btn" id="lets-play">Let's play</button>
  </dialog>

  <dialog id="end-dialog">
    <div class="confetti" id="confetti"></div>
    <div class="end-animal" id="end-animal"></div>
    <h2 id="end-title"></h2>
    <p id="end-text"></p>
    <div class="dialog-actions">
      <button type="button" class="text-btn" id="keep-btn">Keep playing</button>
      <button type="button" class="text-btn" id="again-btn">Play again</button>
    </div>
  </dialog>

  <script src="logic.js"></script>
  <script src="animals.js"></script>
  <script src="game.js"></script>
</body>
</html>
